<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Oposiciones - Modos de Estudio, Prueba y Examen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6; 
        }

        /* Encabezado Principal */
        .app-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 35px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }
        .app-header h1 { margin: 0; font-size: 2.3rem; font-weight: 700; letter-spacing: -0.5px; }
        .app-header p { margin: 10px 0 0 0; font-size: 1.05rem; opacity: 0.9; font-weight: 300; }

        /* Pantallas */
        .pantalla { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .pantalla.activa { display: block; }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Tarjetas de Familias (Grid) */
        .grid-familias { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        
        .card-familia {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px 24px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }
        .card-familia::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }
        .card-familia:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -5px rgba(0,0,0,0.08);
            border-color: var(--border-hover);
        }
        .card-familia:hover::before { width: 8px; }
        
        .card-familia-icon { font-size: 2.2rem; margin-bottom: 12px; }
        .card-familia-title { 
            font-size: 1.15rem; 
            font-weight: 600; 
            color: var(--text-main); 
            line-height: 1.4; 
            border: none; 
            background: transparent; 
            padding: 0; 
            text-align: left; 
        }

        /* Sección Temas */
        .temas-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-reset-scores {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--border-hover);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-reset-scores:hover {
            color: var(--error);
            border-color: var(--error);
            background-color: var(--error-bg);
        }

        /* Tarjetas de Temas con Modos y Puntuación */
        .grid-temas { display: flex; flex-direction: column; gap: 18px; margin-top: 15px; }
        
        .card-tema-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 24px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .card-tema-container:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
        }

        .card-tema-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .tema-numero {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(79, 70, 229, 0.25);
        }

        .tema-titulo {
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-main);
            flex: 1;
            min-width: 240px;
            line-height: 1.4;
        }

        .tema-score-container {
            flex-shrink: 0;
        }

        /* Badges de Puntuación */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .badge-pendiente {
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .badge-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid #a7f3d0;
        }
        .badge-warning {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid #fde68a;
        }
        .badge-danger {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #fca5a5;
        }

        /* Botones de Modo */
        .card-tema-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
        }

        .btn-modo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            font-family: inherit;
        }
        .btn-modo svg { flex-shrink: 0; }

        .btn-estudio {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }
        .btn-estudio:hover {
            background: #dbeafe;
            color: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.15);
        }

        .btn-prueba {
            background: #f0fdf4;
            color: #15803d;
            border-color: #bbf7d0;
        }
        .btn-prueba:hover {
            background: #dcfce7;
            color: #166534;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(21, 128, 61, 0.15);
        }

        .btn-examen {
            background: #f5f3ff;
            color: #6d28d9;
            border-color: #ddd6fe;
        }
        .btn-examen:hover {
            background: #ede9fe;
            color: #5b21b6;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(109, 40, 217, 0.15);
        }

        /* Botón Volver */
        .btn-volver {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-volver:hover { background-color: var(--border); color: var(--text-main); }

        /* Interfaz del Test / Examen / Estudio */
        .test-header { 
            background: var(--card-bg); 
            padding: 25px 30px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            margin-bottom: 25px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); 
            position: relative;
        }
        .test-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 10px;
        }
        .test-header h2 { font-size: 1.4rem; margin: 0; color: var(--primary); }
        .test-header p { color: var(--text-muted); margin: 5px 0 0 0; font-size: 0.92rem; }
        
        /* Modos Badge */
        .tag-modo {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .tag-estudio { background: #dbeafe; color: #1e40af; }
        .tag-prueba { background: #dcfce7; color: #166534; }
        .tag-examen { background: #ede9fe; color: #5b21b6; }

        /* Barra de progreso */
        .progress-container { width: 100%; background: var(--border); border-radius: 10px; height: 8px; margin-top: 18px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.4s ease; }
        .progress-text { text-align: right; font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

        /* Contenedor Preguntas */
        .pregunta-container { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            margin-bottom: 25px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); 
            transition: all 0.2s ease;
        }
        .pregunta-titulo { 
            font-size: 1.15rem; 
            font-weight: 600; 
            margin-bottom: 22px; 
            color: var(--text-main); 
            line-height: 1.5; 
        }
        
        .opciones-list { display: flex; flex-direction: column; gap: 10px; }

        .opcion {
            display: flex; 
            align-items: flex-start;
            gap: 12px;
            width: 100%; 
            text-align: left; 
            padding: 16px 20px;
            background-color: var(--bg-color); 
            border: 2px solid var(--border); 
            color: var(--text-main);
            border-radius: 12px; 
            font-weight: 500; 
            font-size: 0.98rem; 
            cursor: pointer;
            transition: all 0.2s; 
            font-family: inherit;
            position: relative;
            line-height: 1.4;
        }
        .opcion:hover:not(:disabled):not(.estudio-item) { 
            background-color: #f1f5f9; 
            border-color: var(--primary); 
            transform: translateX(4px); 
        }
        .opcion:disabled { cursor: default; }

        /* Estado Examen: Seleccionada */
        .opcion.seleccionada {
            background-color: #e0e7ff !important;
            border-color: var(--primary) !important;
            color: var(--primary) !important;
            font-weight: 600;
        }
        
        /* Correcciones de respuesta */
        .opcion.correcta {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: var(--success-text) !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }
        .opcion.incorrecta {
            background-color: var(--error-bg) !important;
            border-color: var(--error) !important;
            color: var(--error-text) !important;
        }

        /* Estilo Modo Estudio Solución */
        .opcion-estudio-correcta {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: var(--success-text) !important;
            font-weight: 600;
        }
        .badge-solucion {
            margin-left: auto;
            background-color: var(--success);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* Botón de Siguiente (Modo Prueba) y Corregir (Modo Examen) */
        .prueba-nav-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .btn-siguiente {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-siguiente:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .examen-footer {
            text-align: center;
            margin: 40px 0 20px 0;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        .btn-corregir-examen {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
        }
        .btn-corregir-examen:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.45);
        }

        /* Panel de Resultados / Estadísticas */
        .estadisticas { 
            display: none; 
            margin-top: 35px; 
            padding: 40px 30px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            text-align: center; 
            border: 1px solid var(--border); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08); 
        }
        .estadisticas.visible { display: block; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .estadisticas h3 { margin-top: 0; font-size: 1.8rem; color: var(--text-main); }
        
        .score-circle {
            display: inline-flex; flex-direction: column; justify-content: center; align-items: center;
            width: 140px; height: 140px; border-radius: 50%; background: var(--bg-color);
            border: 8px solid var(--primary); font-size: 2rem; font-weight: 700;
            color: var(--primary); margin: 20px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .score-circle span.nota-num { font-size: 2.2rem; line-height: 1; }
        .score-circle span.nota-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; font-weight: 600; }

        .stats-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .stat-box { padding: 15px 25px; border-radius: 12px; background: var(--bg-color); border: 1px solid var(--border); min-width: 120px; }
        .stat-box span { display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stat-box strong { display: block; font-size: 1.6rem; margin-top: 4px; }

        .section-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; color: var(--text-main); }
    </style>
</head>
<body>

    <!-- PANTALLA 1: Selección de Familia -->
    <div id="pantalla-familias" class="pantalla activa">
        <header class="app-header">
            <h1>Plataforma de Oposiciones</h1>
            <p>Selecciona tu área de estudio para comenzar a practicar</p>
        </header>
        
        <h2 class="section-title">Especialidades Disponibles</h2>
        <div class="grid-familias" id="lista-familias"></div>
    </div>

    <!-- PANTALLA 2: Selección de Tema -->
    <div id="pantalla-temas" class="pantalla">
        <button class="btn-volver" onclick="mostrarPantalla('familias')">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver a Especialidades
        </button>
        
        <div class="temas-header-bar">
            <h2 class="section-title" id="titulo-familia-seleccionada" style="margin-bottom: 0;">Temas</h2>
            <button class="btn-reset-scores" onclick="reiniciarPuntuaciones()">Resetear puntuaciones</button>
        </div>
        
        <div class="grid-temas" id="lista-temas"></div>
    </div>

    <!-- PANTALLA 3: Modo Test / Estudio / Prueba / Examen -->
    <div id="pantalla-test" class="pantalla">
        <button class="btn-volver" onclick="mostrarPantalla('temas')">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver a Temas
        </button>
        
        <div class="test-header">
            <div class="test-header-top">
                <h2 id="titulo-test">Test</h2>
                <div id="tag-modo-container"></div>
            </div>
            <p id="subtitulo-test">Cargando archivo...</p>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">0 / 0 Respondidas</div>
        </div>
        
        <div id="contenedor-preguntas"></div>

        <div id="examen-footer-container"></div>
        
        <div id="panel-estadisticas" class="estadisticas">
            <h3 id="titulo-resultado">¡Test Finalizado!</h3>
            <div class="score-circle" id="circle-score">
                <span class="nota-num" id="score-text">0/0</span>
                <span class="nota-label" id="score-label">Aciertos</span>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span>Aciertos</span>
                    <strong id="score-aciertos" style="color: var(--success)">0</strong>
                </div>
                <div class="stat-box">
                    <span>Fallos</span>
                    <strong id="score-fallos" style="color: var(--error)">0</strong>
                </div>
                <div class="stat-box">
                    <span>Porcentaje</span>
                    <strong id="score-porcentaje" style="color: var(--primary)">0%</strong>
                </div>
            </div>
            <button class="btn-volver" style="margin-top: 30px; background: var(--primary); color: white; border: none; padding: 14px 28px;" onclick="mostrarPantalla('temas')">
                Volver a la lista de temas
            </button>
        </div>
    </div>

        /* GESTIÓN DE PUNTUACIONES (LOCALSTORAGE) */
        function getPuntuaciones() {
            try {
                return JSON.parse(localStorage.getItem('opos_puntuaciones') || '{}');
            } catch(e) {
                return {};
            }
        }

        function guardarPuntuacion(archivoId, aciertos, total) {
            if (total === 0) return;
            const scores = getPuntuaciones();
            const porcentaje = Math.round((aciertos / total) * 100);
            const nota = ((aciertos / total) * 10).toFixed(1);
            
            scores[archivoId] = {
                aciertos: aciertos,
                total: total,
                nota: nota,
                porcentaje: porcentaje,
                fecha: new Date().toLocaleDateString('es-ES')
            };
            
            localStorage.setItem('opos_puntuaciones', JSON.stringify(scores));
        }

        function reiniciarPuntuaciones() {
            if (confirm("¿Estás seguro de que deseas borrar el historial de puntuaciones de todos los temas?")) {
                localStorage.removeItem('opos_puntuaciones');
                if (familiaActual) {
                    cargarTemas(familiaActual);
                }
            }
        }

        /* NAVEGACIÓN Y PANTALLAS */
        function mostrarPantalla(pantalla) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            window.scrollTo(0, 0);
            document.getElementById(`pantalla-${pantalla}`).classList.add('activa');
        }

        function inicializar() {
            const contenedorFamilias = document.getElementById('lista-familias');
            contenedorFamilias.innerHTML = '';
            let i = 0;
            for (let nombreFamilia in familias) {
                const card = document.createElement('div');
                card.className = 'card-familia';
                const icon = iconMap[i % iconMap.length];
                
                card.innerHTML = `
                    <div class="card-familia-icon">${icon}</div>
                    <button class="card-familia-title">${nombreFamilia}</button>
                `;
                
                card.onclick = () => cargarTemas(nombreFamilia);
                contenedorFamilias.appendChild(card);
                i++;
            }
        }

        function cargarTemas(nombreFamilia) {
            familiaActual = nombreFamilia;
            document.getElementById('titulo-familia-seleccionada').textContent = nombreFamilia;
            const contenedorTemas = document.getElementById('lista-temas');
            contenedorTemas.innerHTML = ''; 

            const puntuaciones = getPuntuaciones();

            familias[nombreFamilia].forEach(archivoId => {
                const div = document.createElement('div');
                div.className = 'card-tema-container';
                
                const textoCompleto = titulosTemas[archivoId] || `Tema ${archivoId}`;
                const regex = /^(tema \d+\.-|tema \d+\.-|Tema \d+\.-|Tema \d+:\s*)(.*)/i;
                const match = textoCompleto.match(regex);
                
                let numTemaStr = `Tema ${archivoId}`;
                let tituloStr = textoCompleto;
                
                if(match) {
                    numTemaStr = `Tema ${match[1].replace('.-','').replace(':','').trim().replace(/tema /i, '')}`;
                    tituloStr = match[2];
                }

                // Renderizado de badge de puntuación
                let badgeHtml = '<span class="badge badge-pendiente">Sin realizar</span>';
                if (puntuaciones[archivoId]) {
                    const p = puntuaciones[archivoId];
                    let badgeClass = 'badge-success';
                    if (p.porcentaje < 50) badgeClass = 'badge-danger';
                    else if (p.porcentaje < 80) badgeClass = 'badge-warning';
                    
                    badgeHtml = `<span class="badge ${badgeClass}" title="Último intento: ${p.fecha}">Score: ${p.aciertos}/${p.total} (${p.nota})</span>`;
                }

                div.innerHTML = `
                    <div class="card-tema-header">
                        <div class="tema-numero">${numTemaStr}</div>
                        <div class="tema-titulo">${tituloStr}</div>
                        <div class="tema-score-container">${badgeHtml}</div>
                    </div>
                    <div class="card-tema-actions">
                        <button class="btn-modo btn-estudio" onclick="iniciarModo('${archivoId}', 'estudio')">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            <span>Estudio</span>
                        </button>
                        <button class="btn-modo btn-prueba" onclick="iniciarModo('${archivoId}', 'prueba')">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <span>Prueba (1 a 1)</span>
                        </button>
                        <button class="btn-modo btn-examen" onclick="iniciarModo('${archivoId}', 'examen')">
                            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                contenedorTemas.appendChild(div);

            mostrarPantalla('temas');

        async function iniciarModo(archivoId, modo) {
            archivoIdActual = archivoId;
            modoActual = modo;
            
            document.getElementById('titulo-test').textContent = titulosTemas[archivoId] || `Tema ${archivoId}`;
            document.getElementById('subtitulo-test').textContent = `Cargando archivo ${archivoId}.csv...`;
            
            // Render del Tag de modo
            const tagContainer = document.getElementById('tag-modo-container');
            if (modo === 'estudio') {
                tagContainer.innerHTML = `<span class="tag-modo tag-estudio">📖 Modo Estudio</span>`;
            } else if (modo === 'prueba') {
                tagContainer.innerHTML = `<span class="tag-modo tag-prueba">⚡ Modo Prueba</span>`;
            } else {
                tagContainer.innerHTML = `<span class="tag-modo tag-examen">📝 Modo Examen</span>`;
            }

            document.getElementById('panel-estadisticas').classList.remove('visible');
            document.getElementById('examen-footer-container').innerHTML = '';
            
            aciertos = 0; fallos = 0; respondidas = 0; totalPreguntas = 0;
            indicePreguntaPrueba = 0;
            respuestasExamen = {};

            mostrarPantalla('test');

            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '<p style="text-align:center; padding: 40px; color:#64748b;">Cargando preguntas...</p>';

            try {
                const response = await fetch(`${archivoId}.csv`);
                if (!response.ok) throw new Error("No se encontró el archivo");
                const csvTexto = await response.text();
                procesarCSV(csvTexto);
            } catch (error) {
                contenedor.innerHTML = `
                    <div style="background: var(--error-bg); border: 1px solid var(--error); padding: 30px; border-radius: 12px; color: #991b1b; text-align: center;">
                        <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom:15px"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <h3 style="margin-top:0; color:#991b1b;">Error al cargar ${archivoId}.csv</h3>
                        <p>Asegúrate de que el archivo <strong>${archivoId}.csv</strong> está en la misma carpeta que este HTML.</p>
                        <p style="font-size: 0.9em; opacity: 0.8; margin-top: 15px;"><em>Nota: Recuerda abrir este archivo a través de un servidor local (Live Server).</em></p>
                    </div>`;
            }
        }

        function procesarCSV(texto) {
            const lineas = texto.split('
').filter(linea => linea.trim() !== '');
            preguntasData = [];
            
            for (let i = 1; i < lineas.length; i++) {
                const columnas = parseCSVLine(lineas[i]);
                if (columnas.length >= 6) {
                    preguntasData.push({
                        pregunta: columnas[0].replace(/^"|"$/g, '').trim(),
                        opciones: [
                            columnas[1].replace(/^"|"$/g, '').trim(),
                            columnas[2].replace(/^"|"$/g, '').trim(),
                            columnas[3].replace(/^"|"$/g, '').trim(),
                            columnas[4].replace(/^"|"$/g, '').trim()
                        ],
                        respuestaCorrecta: parseInt(columnas[5].trim())
                    });
                }
            }

            totalPreguntas = preguntasData.length;

            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';

            if (totalPreguntas === 0) {
                contenedor.innerHTML = '<p>El archivo CSV está vacío o no tiene el formato correcto.</p>';
                return;
            }

            document.getElementById('subtitulo-test').textContent = `${totalPreguntas} preguntas en total`;

            // Renderizar según el modo seleccionado
            if (modoActual === 'estudio') {
                renderizarModoEstudio();
            } else if (modoActual === 'prueba') {
                renderizarModoPrueba();
            } else if (modoActual === 'examen') {
                renderizarModoExamen();
            }
        }

        function parseCSVLine(text) {
            let ret = [], inQuote = false, value = '';
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (inQuote) {
                    if (char === '"') {
                        if (i < text.length - 1 && text[i+1] === '"') { value += '"'; i++; }
                        else { inQuote = false; }
                    } else { value += char; }
                } else {
                    if (char === '"') { inQuote = true; }
                    else if (char === SEPARADOR_CSV) { ret.push(value); value = ''; }
                    else { value += char; }
                }
            }
            ret.push(value);
            return ret;
        }

        /* -------------------------------------------------------------

        function renderizarModoEstudio() {

            preguntasData.forEach((q, qIndex) => {
                const div = document.createElement('div');
                div.className = 'pregunta-container';

                const titulo = document.createElement('div');
                titulo.className = 'pregunta-titulo';
                titulo.textContent = `${qIndex + 1}. ${q.pregunta}`;
                div.appendChild(titulo);

                const opcionesList = document.createElement('div');
                opcionesList.className = 'opciones-list';

                q.opciones.forEach((opTexto, opIndex) => {
                    const opDiv = document.createElement('div');
                    opDiv.className = 'opcion estudio-item';
                    
                    const esCorrecta = (opIndex + 1 === q.respuestaCorrecta);
                    
                    if (esCorrecta) {
                        opDiv.classList.add('opcion-estudio-correcta');
                        opDiv.innerHTML = `
                            <span><strong>${String.fromCharCode(65 + opIndex)})</strong> ${opTexto}</span>
                            <span class="badge-solucion">✓ Solución Correcta</span>
                        `;
                    } else {
                        opDiv.innerHTML = `<span><strong>${String.fromCharCode(65 + opIndex)})</strong> ${opTexto}</span>`;
                    }
                    opcionesList.appendChild(opDiv);
                });

                div.appendChild(opcionesList);
                contenedor.appendChild(div);
            });
        }

        /* -------------------------------------------------------------
           2. MODO PRUEBA: Pregunta por pregunta con corrección instantánea
        ------------------------------------------------------------- */
        function renderizarModoPrueba() {
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-text').style.display = 'block';
            indicePreguntaPrueba = 0;
            aciertos = 0;
            fallos = 0;
            respondidas = 0;
            actualizarBarraProgreso();
            mostrarPreguntaPrueba(indicePreguntaPrueba);
        }

        function mostrarPreguntaPrueba(index) {
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';

            const q = preguntasData[index];
            const div = document.createElement('div');
            div.className = 'pregunta-container';

            const titulo = document.createElement('div');
            titulo.className = 'pregunta-titulo';
            titulo.textContent = `${index + 1}. ${q.pregunta}`;
            div.appendChild(titulo);

            const opcionesList = document.createElement('div');
            opcionesList.className = 'opciones-list';

            q.opciones.forEach((opTexto, opIndex) => {
                const btnOpcion = document.createElement('button');
                btnOpcion.className = 'opcion';
                btnOpcion.innerHTML = `<span><strong>${String.fromCharCode(65 + opIndex)})</strong> ${opTexto}</span>`;

                btnOpcion.onclick = function() {
                    const hermanos = opcionesList.querySelectorAll('.opcion');
                    hermanos.forEach(b => b.disabled = true);
                    respondidas++;

                    const esCorrecta = (opIndex + 1 === q.respuestaCorrecta);
                    if (esCorrecta) {
                        this.classList.add('correcta');
                        aciertos++;
                    } else {
                        this.classList.add('incorrecta');
                        fallos++;
                        if (hermanos[q.respuestaCorrecta - 1]) {
                            hermanos[q.respuestaCorrecta - 1].classList.add('correcta');
                        }
                    }

                    actualizarBarraProgreso();

                    // Botón para avanzar a la siguiente pregunta
                    const navContainer = document.createElement('div');
                    navContainer.className = 'prueba-nav-container';

                    const btnSig = document.createElement('button');
                    btnSig.className = 'btn-siguiente';
                    if (index + 1 < totalPreguntas) {
                        btnSig.innerHTML = `Siguiente Pregunta <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`;
                        btnSig.onclick = () => {
                            indicePreguntaPrueba++;
                            mostrarPreguntaPrueba(indicePreguntaPrueba);
                        };
                    } else {
                        btnSig.innerHTML = `Ver Resultados Finales 🎉`;
                        btnSig.onclick = () => finalizarPrueba();
                    }

                    navContainer.appendChild(btnSig);
                    div.appendChild(navContainer);
                };

                opcionesList.appendChild(btnOpcion);
            });

            div.appendChild(opcionesList);
            contenedor.appendChild(div);
        }

        function finalizarPrueba() {
            guardarPuntuacion(archivoIdActual, aciertos, totalPreguntas);
            mostrarResultados("¡Prueba Finalizada!");
        }

        /* -------------------------------------------------------------
           3. MODO EXAMEN: 20 preguntas a la vez con botón Corregir
        ------------------------------------------------------------- */
        function renderizarModoExamen() {
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-text').style.display = 'block';
            
            respuestasExamen = {};
            respondidas = 0;
            actualizarBarraProgreso();

            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';

            preguntasData.forEach((q, qIndex) => {
                const div = document.createElement('div');
                div.className = 'pregunta-container';
                div.id = `pregunta-exam-${qIndex}`;

                const titulo = document.createElement('div');
                titulo.className = 'pregunta-titulo';
                titulo.textContent = `${qIndex + 1}. ${q.pregunta}`;
                div.appendChild(titulo);

                const opcionesList = document.createElement('div');
                opcionesList.className = 'opciones-list';

                q.opciones.forEach((opTexto, opIndex) => {
                    const btnOpcion = document.createElement('button');
                    btnOpcion.className = 'opcion';
                    btnOpcion.id = `opt-${qIndex}-${opIndex}`;
                    btnOpcion.innerHTML = `<span><strong>${String.fromCharCode(65 + opIndex)})</strong> ${opTexto}</span>`;

                    btnOpcion.onclick = function() {
                        const hermanos = opcionesList.querySelectorAll('.opcion');
                        hermanos.forEach(b => b.classList.remove('seleccionada'));
                        
                        this.classList.add('seleccionada');
                        
                        if (!(qIndex in respuestasExamen)) {
                            respondidas++;
                        }
                        respuestasExamen[qIndex] = opIndex + 1;
                        actualizarBarraProgreso();
                    };

                    opcionesList.appendChild(btnOpcion);
                });

                div.appendChild(opcionesList);
                contenedor.appendChild(div);
            });

            // Botón Corregir al final de la página
            const footerContainer = document.getElementById('examen-footer-container');
            footerContainer.innerHTML = `
                <div class="examen-footer">
                    <button class="btn-corregir-examen" onclick="corregirExamen()">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Corregir Examen
                    </button>
                </div>
            `;
        }

        function corregirExamen() {
            aciertos = 0;
            fallos = 0;

            preguntasData.forEach((q, qIndex) => {
                const seleccionada = respuestasExamen[qIndex];
                const correcta = q.respuestaCorrecta;
                const preguntaDiv = document.getElementById(`pregunta-exam-${qIndex}`);
                const opcionesBtns = preguntaDiv.querySelectorAll('.opcion');

                opcionesBtns.forEach(btn => btn.disabled = true);

                if (seleccionada !== undefined) {
                    if (seleccionada === correcta) {
                        aciertos++;
                        document.getElementById(`opt-${qIndex}-${seleccionada - 1}`).classList.add('correcta');
                    } else {
                        fallos++;
                        document.getElementById(`opt-${qIndex}-${seleccionada - 1}`).classList.add('incorrecta');
                        document.getElementById(`opt-${qIndex}-${correcta - 1}`).classList.add('correcta');
                    }
                } else {
                    // Sin responder se cuenta como fallo
                    fallos++;
                    document.getElementById(`opt-${qIndex}-${correcta - 1}`).classList.add('correcta');
                    preguntaDiv.style.borderColor = 'var(--warning)';
                }
            });

            // Ocultar botón corregir para evitar re-envíos
            document.getElementById('examen-footer-container').innerHTML = '';

            // Guardar puntuación y mostrar estadísticas
            guardarPuntuacion(archivoIdActual, aciertos, totalPreguntas);
            mostrarResultados("¡Examen Corregido!");
        }

        /* -------------------------------------------------------------
           UTILIDADES Y RESULTADOS
        ------------------------------------------------------------- */
        function actualizarBarraProgreso() {
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            
            if (totalPreguntas === 0) {
                bar.style.width = '0%';
                text.textContent = '0 / 0 Respondidas';
                return;
            }
            
            const porcentaje = (respondidas / totalPreguntas) * 100;
            bar.style.width = `${porcentaje}%`;
            text.textContent = `${respondidas} / ${totalPreguntas} Respondidas`;
        }

        function mostrarResultados(titulo) {
            document.getElementById('titulo-resultado').textContent = titulo;
            const statsPanel = document.getElementById('panel-estadisticas');
            statsPanel.classList.add('visible');
            
            const notaNum = ((aciertos / totalPreguntas) * 10).toFixed(1);
            const porcentaje = Math.round((aciertos / totalPreguntas) * 100);

            document.getElementById('score-text').textContent = notaNum;
            document.getElementById('score-label').textContent = `${aciertos}/${totalPreguntas} aciertos`;
            document.getElementById('score-aciertos').textContent = aciertos;
            document.getElementById('score-fallos').textContent = fallos;
            document.getElementById('score-porcentaje').textContent = `${porcentaje}%`;
            
            const circle = document.getElementById('circle-score');
            if(porcentaje >= 80) {
                circle.style.borderColor = 'var(--success)';
                circle.style.color = 'var(--success)';
            } else if(porcentaje >= 50) {
                circle.style.borderColor = 'var(--warning)';
                circle.style.color = 'var(--warning-text)';
            } else {
                circle.style.borderColor = 'var(--error)';
                circle.style.color = 'var(--error)';
            }

            statsPanel.scrollIntoView({ behavior: 'smooth' });
        }

        // Inicializar la app al cargar
        inicializar();
    </script>
</body>
</html>
