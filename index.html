<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Tests Oposiciones</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f0f4f8; color: #333; line-height: 1.6; }
        h1, h2, h3 { color: #1e3a8a; }
        .pantalla { display: none; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .pantalla.activa { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .grid-familias { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .grid-temas { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        
        button { padding: 15px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s; font-weight: 600; text-align: left; }
        
        .btn-familia { background-color: #3b82f6; color: white; text-align: center; font-size: 18px; padding: 25px; }
        .btn-familia:hover { background-color: #2563eb; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3); }
        
        .btn-tema { background-color: #f8fafc; color: #334155; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between; }
        .btn-tema:hover { background-color: #e2e8f0; border-color: #94a3b8; }
        .btn-tema span.num { background: #1e3a8a; color: white; padding: 4px 10px; border-radius: 20px; font-size: 14px; margin-right: 15px; flex-shrink: 0; }
        
        .btn-volver { background-color: #64748b; color: white; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; }
        .btn-volver:hover { background-color: #475569; }
        
        /* Estilos del Test */
        .test-header { border-bottom: 2px solid #e2e8f0; margin-bottom: 30px; padding-bottom: 15px; }
        .test-header h2 { font-size: 1.5rem; margin-bottom: 5px; }
        .test-header p { color: #64748b; font-size: 0.95rem; margin-top: 0; }
        
        .pregunta-container { margin-bottom: 40px; background: #fff; padding: 25px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .pregunta-titulo { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; color: #1e293b; }
        
        .opcion { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 16px 20px; background-color: #f8fafc; border: 2px solid #e2e8f0; color: #334155; border-radius: 8px; font-weight: normal; }
        .opcion:hover:not(:disabled) { background-color: #f1f5f9; border-color: #cbd5e1; }
        .opcion:disabled { cursor: default; opacity: 0.9; }
        
        .opcion.correcta { background-color: #f0fdf4 !important; border-color: #22c55e !important; color: #166534 !important; box-shadow: 0 0 0 1px #22c55e; }
        .opcion.incorrecta { background-color: #fef2f2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        
        .estadisticas { display: none; margin-top: 40px; padding: 25px; background: #f8fafc; border-radius: 10px; text-align: center; border: 1px solid #e2e8f0; }
        .estadisticas.visible { display: block; animation: fadeIn 0.5s; }
        .estadisticas h3 { margin-top: 0; font-size: 1.4rem; }
        .score-circle { display: inline-flex; justify-content: center; align-items: center; width: 100px; height: 100px; border-radius: 50%; background: white; border: 6px solid #3b82f6; font-size: 1.8rem; font-weight: bold; color: #1e3a8a; margin: 15px 0; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: Selección de Familia -->
    <div id="pantalla-familias" class="pantalla activa">
        <h1>📚 Plataforma de Tests</h1>
        <p>Selecciona una familia para ver sus temas disponibles:</p>
        <div class="grid-familias" id="lista-familias"></div>
    </div>

    <!-- PANTALLA 2: Selección de Tema -->
    <div id="pantalla-temas" class="pantalla">
        <button class="btn-volver" onclick="mostrarPantalla('familias')">← Volver a Familias</button>
        <h2 id="titulo-familia-seleccionada">Temas</h2>
        <div class="grid-temas" id="lista-temas"></div>
    </div>

    <!-- PANTALLA 3: El Test -->
    <div id="pantalla-test" class="pantalla">
        <button class="btn-volver" onclick="mostrarPantalla('temas')">← Volver a Temas</button>
        <div class="test-header">
            <h2 id="titulo-test">Test</h2>
            <p id="subtitulo-test">Cargando archivo...</p>
        </div>
        
        <div id="contenedor-preguntas"></div>
        
        <div id="panel-estadisticas" class="estadisticas">
            <h3>Resultados del Test</h3>
            <div class="score-circle">
                <span id="score-text">0/0</span>
            </div>
            <p>Aciertos: <strong id="score-aciertos" style="color: #166534">0</strong> | Fallos: <strong id="score-fallos" style="color: #991b1b">0</strong></p>
        </div>
    </div>

. Comisiones informativas.", "2.2_18": "Tema 18.- Régimen de sesiones y acuerdos de los órganos de gobierno local. actas, certificaciones, comunicaciones, notificaciones y publicación de los acuerdos. el registro de los documentos.", "2.2_19": "Tema 19.- Singularidades del procedimiento administrativo en las entidades locales. La revisión y revocación de los actos de los entes locales. tramitación de expedientes. Los interesados. abstenciones y recusaciones. Recursos administrativos y jurisdiccionales contra los actos locales.", "2.2_20": "Tema 20.- Los bienes de las entidades Locales: clases y régimen jurídico. Prerrogativas de los entes Locales respecto a sus bienes.", "2.2_21": "Tema 21.- Régimen jurídico de las Haciendas Locales. Los recursos de las Haciendas Locales. Las ordenanzas Fiscales.", "2.2_22": "Tema 22.- Los tributos locales. tasas, contribuciones especiales y precios públicos.", "2.2_23": "Tema 23.- Gestión, Recaudación e inspección de los tributos y precios públicos.", "2.2_24": "Tema 24.- el Presupuesto General de las entidades Locales. Contenido. elaboración y aprobación.", "2.2_25": "Tema 25.- La ejecución del Presupuesto de gastos: Sus fases. Los pagos a justificar y los anticipos de caja fija.", "2.2_26": "Tema 26.- el personal al servicio de las administraciones locales: clases y régimen jurídico. adquisición y pérdida de la relación de servicio. instrumentos de ordenación de los Recursos Humanos: La Relación de Puestos de trabajo, la Plantilla y la oferta de empleo Público.", "2.2_27": "Tema 27.- Derechos y deberes de los empleados públicos. Derecho a la carrera profesional y a la promoción interna. Derechos retributivos. Situaciones administrativas. Régimen disciplinario.", "2.2_28": "Tema 28.- Régimen urbanístico de la propiedad del suelo. Contenido del derecho de propiedad del suelo: facultades, deberes y cargas.", "2.2_29": "Tema 29.- instrumentos de Planeamiento general y Planeamiento de desarrollo. Las ordenanzas urbanísticas.", "2.2_30         const familias = {"Familia 1": ["1_1", "1_2", "1_3", "1_4", "1_5", "1_6", "1_7"], "Familia 1.1": ["1.1_1", "1.1_2", "1.1_3", "1.1_4", "1.1_5", "1.1_6", "1.1_7", "1.1_8", "1.1_9"], "Familia 2": ["2_1", "2_2", "2_3", "2_4", "2_5", "2_6", "2_7", "2_8", "2_9", "2_10", "2_11", "2_12", "2_13", "2_14", "2_15", "2_16", "2_17"], "Familia 2.1": ["2.1_1", "2.2_2", "2.2_3", "2.2_4", "2.2_5", "2.2_6", "2.2_7", "2.2_8", "2.2_9", "2.2_10", "2.2_11", "2.2_12", "2.2_13", "2.2_14", "2.2_15", "2.2_16", "2.2_17", "2.2_18", "2.2_19", "2.2_20", "2.2_21", "2.2_22", "2.2_23", "2.2_24", "2.2_25", "2.2_26", "2.2_27", "2.2_28", "2.2_29", "2.2_30"]};
        const SEPARADOR_CSV = ','; 

        let aciertos = 0;
        let fallos = 0;
        let totalPreguntas = 0;
        let respondidas = 0;

        function mostrarPantalla(pantalla) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(`pantalla-${pantalla}`).classList.add('activa');
        }

        function inicializar() {
            const contenedorFamilias = document.getElementById('lista-familias');
            for (let nombreFamilia in familias) {
                const btn = document.createElement('button');
                btn.className = 'btn-familia';
                btn.textContent = nombreFamilia;
                btn.onclick = () => cargarTemas(nombreFamilia);
                contenedorFamilias.appendChild(btn);
            }
        }

        function cargarTemas(nombreFamilia) {
            document.getElementById('titulo-familia-seleccionada').textContent = nombreFamilia;
            const contenedorTemas = document.getElementById('lista-temas');
            contenedorTemas.innerHTML = ''; 

            familias[nombreFamilia].forEach(archivoId => {
                const btn = document.createElement('button');
                btn.className = 'btn-tema';
                
                const textoCompleto = titulosTemas[archivoId] || `Tema ${archivoId}`;
                
                // Extraer el número de tema (e.g. "Tema 1") y el resto del título
                const regex = /^(tema \d+\.-|tema \d+\.-|Tema \d+\.-|Tema \d+:\s*)(.*)/i;
                const match = textoCompleto.match(regex);
                
                if(match) {
                    btn.innerHTML = `<span class="num">${match[1].replace('.-','').replace(':','').trim()}</span> <span class="texto">${match[2]}</span>`;
                } else {
                    btn.innerHTML = `<span class="texto">${textoCompleto}</span>`;
                }
                
                btn.onclick = () => cargarTest(archivoId);
                contenedorTemas.appendChild(btn);
            });

            mostrarPantalla('temas');
        }

        async function cargarTest(archivoId) {
            document.getElementById('titulo-test').textContent = titulosTemas[archivoId] || `Test ${archivoId}`;
            document.getElementById('subtitulo-test').textContent = `Leyendo archivo: ${archivoId}.csv`;
            
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '<p>Cargando preguntas...</p>';
            
            document.getElementById('panel-estadisticas').classList.remove('visible');
            aciertos = 0; fallos = 0; respondidas = 0; totalPreguntas = 0;
            
            mostrarPantalla('test');

            try {
                const response = await fetch(`${archivoId}.csv`);
                if (!response.ok) throw new Error("No se encontró el archivo");
                const csvTexto = await response.text();
                procesarCSV(csvTexto);
            } catch (error) {
                contenedor.innerHTML = `
                    <div style="background: #fee2e2; border: 1px solid #ef4444; padding: 20px; border-radius: 8px; color: #991b1b;">
                        <h3 style="margin-top:0; color:#991b1b;">Error al cargar ${archivoId}.csv</h3>
                        <p>Asegúrate de que el archivo <strong>${archivoId}.csv</strong> está en la misma carpeta que este HTML.</p>
                        <p><em>Nota: Recuerda que debes abrir este archivo a través de un servidor local (ej: Live Server en VSCode o python -m http.server), no con doble clic.</em></p>
                    </div>`;
            }
        }

        function procesarCSV(texto) {
            const lineas = texto.split('\n').filter(linea => linea.trim() !== '');
            const contenedor = document.getElementById('contenedor-preguntas');
            contenedor.innerHTML = '';
            
            totalPreguntas = lineas.length - 1; // Restar cabecera
            
            if(totalPreguntas <= 0) {
                contenedor.innerHTML = '<p>El archivo CSV parece estar vacío o no tiene el formato correcto.</p>';
                return;
            }

            for (let i = 1; i < lineas.length; i++) {
                const columnas = parseCSVLine(lineas[i]);
                
                if (columnas.length >= 6) {
                    const preguntaStr = columnas[0];
                    const opciones = [ columnas[1], columnas[2], columnas[3], columnas[4] ];
                    const respuestaCorrecta = parseInt(columnas[5].trim());

                    crearBloquePregunta(contenedor, i, preguntaStr, opciones, respuestaCorrecta);
                }
            }
            
            actualizarMarcador();
        }
        
        // Función auxiliar para parsear CSV respetando comillas
        function parseCSVLine(text) {
            let ret = [], inQuote = false, value = '';
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (inQuote) {
                    if (char === '"') {
                        if (i < text.length - 1 && text[i+1] === '"') { value += '"'; i++; }
                        else { inQuote = false; }
                    } else { value += char; }
                } else {
                    if (char === '"') { inQuote = true; }
                    else if (char === SEPARADOR_CSV) { ret.push(value); value = ''; }
                    else { value += char; }
                }
            }
            ret.push(value);
            return ret;
        }

        function crearBloquePregunta(contenedor, numeroPregunta, preguntaTexto, opciones, respuestaCorrecta) {
            const div = document.createElement('div');
            div.className = 'pregunta-container';

            const titulo = document.createElement('div');
            titulo.className = 'pregunta-titulo';
            titulo.textContent = `${numeroPregunta}. ${preguntaTexto.replace(/^"|"$/g, '').trim()}`;
            div.appendChild(titulo);

            opciones.forEach((textoOpcion, index) => {
                const btnOpcion = document.createElement('button');
                btnOpcion.className = 'opcion';
                btnOpcion.textContent = textoOpcion.replace(/^"|"$/g, '').trim();
                
                btnOpcion.onclick = function() {
                    const hermanos = div.querySelectorAll('.opcion');
                    hermanos.forEach(b => b.disabled = true);
                    respondidas++;

                    if (index + 1 === respuestaCorrecta) {
                        this.classList.add('correcta');
                        aciertos++;
                    } else {
                        this.classList.add('incorrecta');
                        fallos++;
                        if(hermanos[respuestaCorrecta - 1]) {
                            hermanos[respuestaCorrecta - 1].classList.add('correcta');
                        }
                    }
                    
                    actualizarMarcador();
                };
                div.appendChild(btnOpcion);
            });

            contenedor.appendChild(div);
        }
        
        function actualizarMarcador() {
            if(respondidas > 0 && respondidas === totalPreguntas) {
                document.getElementById('panel-estadisticas').classList.add('visible');
                document.getElementById('score-text').textContent = `${aciertos}/${totalPreguntas}`;
                document.getElementById('score-aciertos').textContent = aciertos;
                document.getElementById('score-fallos').textContent = fallos;
                
                // Cambiar color del círculo según nota
                const porcentaje = aciertos / totalPreguntas;
                const circle = document.querySelector('.score-circle');
                if(porcentaje >= 0.8) circle.style.borderColor = '#22c55e'; // Verde
                else if(porcentaje >= 0.5) circle.style.borderColor = '#eab308'; // Amarillo
                else circle.style.borderColor = '#ef4444'; // Rojo
            }
        }

        inicializar();
    </script>
</body>
</html>
