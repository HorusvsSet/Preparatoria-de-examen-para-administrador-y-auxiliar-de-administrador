<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta etiqueta CRUCIAL para que se adapte a pantallas de móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App de Aprendizaje</title>
    <style>
        /* Paleta de colores y variables */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --success: #10B981;
            --danger: #EF4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal estilo App */
        .app-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px; /* Ancho máximo para que se vea bien en PC, full width en móvil */
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 24px;
            box-sizing: border-box;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2 {
            text-align: center;
            margin-top: 0;
            color: var(--text);
        }

        p {
            text-align: center;
            color: var(--text-light);
        }

        /* Botones grandes y adaptados para pantallas táctiles */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { background-color: var(--primary-hover); }
        button:active { transform: scale(0.97); }
        
        .btn-secondary { background-color: #E5E7EB; color: var(--text); }
        .btn-secondary:hover { background-color: #D1D5DB; }

        .hidden { display: none !important; }

        /* Área de las tarjetas */
        .card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 250px;
            border: 2px dashed #E5E7EB;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            font-size: 1.25rem;
            background-color: #F9FAFB;
        }

        .progress-text {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Cuadrícula de opciones para el modo examen */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background-color: var(--card-bg);
            color: var(--text);
            border: 2px solid #E5E7EB;
            padding: 14px;
            font-weight: 500;
        }

        .option-btn:hover { background-color: #F3F4F6; }
        
        /* Clases dinámicas para aciertos y errores */
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .incorrect { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        .disabled { opacity: 0.6; pointer-events: none; }

        .answer-reveal {
            margin-top: 20px;
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- PANTALLA PRINCIPAL (MENÚ) -->
        <div id="menu-screen">
            <h1>📚 Mis Apuntes</h1>
            <p>Selecciona un modo para comenzar a repasar.</p>
            <br>
            <button onclick="startMode('estudio')">📖 Modo Estudio</button>
            <button onclick="startMode('examen')">📝 Modo Examen</button>
        </div>

        <!-- MODO ESTUDIO -->
        <div id="study-screen" class="hidden">
            <h2>Modo Estudio</h2>
            <div class="progress-text" id="study-progress">Pregunta 1 de X</div>
            
            <div class="card">
                <div id="study-question">¿Pregunta?</div>
                <div id="study-answer" class="answer-reveal hidden">Respuesta</div>
            </div>

            <button onclick="showAnswer()" id="btn-show-answer">👁️ Ver Respuesta</button>
            <button onclick="nextStudyQuestion()" id="btn-next-study" class="hidden">Siguiente Pregunta ➡️</button>
            <button onclick="goHome()" class="btn-secondary">🏠 Volver al Menú</button>
        </div>

        <!-- MODO EXAMEN -->
        <div id="exam-screen" class="hidden">
            <h2>Modo Examen</h2>
            <div class="progress-text" id="exam-progress">Pregunta 1 de X</div>
            
            <div class="card" style="min-height: 150px;">
                <div id="exam-question">¿Pregunta?</div>
            </div>

            <div class="options-grid" id="exam-options">
                <!-- Las opciones se inyectan con JavaScript -->
            </div>

            <button onclick="nextExamQuestion()" id="btn-next-exam" class="hidden" style="margin-top: 20px;">Siguiente Pregunta ➡️</button>
            <button onclick="goHome()" class="btn-secondary" style="margin-top: 10px;">🏠 Salir del Examen</button>
        </div>

        <!-- PANTALLA DE RESULTADOS (EXAMEN) -->
        <div id="results-screen" class="hidden">
            <h1>🎯 Resultados</h1>
            <div class="card">
                <h2 style="font-size: 3rem; margin: 0; color: var(--primary);" id="score-display">0/0</h2>
                <p id="score-message">¡Buen intento!</p>
            </div>
            <button onclick="startMode('examen')">🔄 Repetir Examen</button>
            <button onclick="goHome()" class="btn-secondary">🏠 Volver al Menú</button>
        </div>

    </div>

    <script>
        // --- BASE DE DATOS DE PREGUNTAS ---
        // Puedes añadir, borrar o editar estas preguntas fácilmente.
        const db = [
            { question: "¿Cuál es el órgano más grande del cuerpo humano?", answer: "La piel", options: ["El hígado", "El corazón", "La piel", "Los pulmones"] },
            { question: "¿En qué año llegó el hombre a la luna?", answer: "1969", options: ["1959", "1969", "1971", "1980"] },
            { question: "¿Cuál es el río más largo del mundo?", answer: "El Amazonas", options: ["El Nilo", "El Amazonas", "El Yangtsé", "El Misisipi"] },
            { question: "¿Quién pintó la Mona Lisa?", answer: "Leonardo da Vinci", options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Miguel Ángel"] }
        ];

        let currentIndex = 0;
        let score = 0;
        let currentMode = '';

        // Referencias del DOM (Pantallas)
        const menuScreen = document.getElementById('menu-screen');
        const studyScreen = document.getElementById('study-screen');
        const examScreen = document.getElementById('exam-screen');
        const resultsScreen = document.getElementById('results-screen');

        // Función para cambiar de pantallas
        function hideAllScreens() {
            menuScreen.classList.add('hidden');
            studyScreen.classList.add('hidden');
            examScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
        }

        function goHome() {
            hideAllScreens();
            menuScreen.classList.remove('hidden');
        }

        function startMode(mode) {
            hideAllScreens();
            currentMode = mode;
            currentIndex = 0;
            score = 0;
            
            // Mezclar preguntas aleatoriamente cada vez que se inicia
            db.sort(() => Math.random() - 0.5);

            if (mode === 'estudio') {
                studyScreen.classList.remove('hidden');
                loadStudyQuestion();
            } else if (mode === 'examen') {
                examScreen.classList.remove('hidden');
                loadExamQuestion();
            }
        }

        // --- LÓGICA MODO ESTUDIO ---
        function loadStudyQuestion() {
            const data = db[currentIndex];
            document.getElementById('study-progress').innerText = `Pregunta ${currentIndex + 1} de ${db.length}`;
            document.getElementById('study-question').innerText = data.question;
            document.getElementById('study-answer').innerText = data.answer;
            
            document.getElementById('study-answer').classList.add('hidden');
            document.getElementById('btn-show-answer').classList.remove('hidden');
            document.getElementById('btn-next-study').classList.add('hidden');
        }

        function showAnswer() {
            document.getElementById('study-answer').classList.remove('hidden');
            document.getElementById('btn-show-answer').classList.add('hidden');
            document.getElementById('btn-next-study').classList.remove('hidden');
            
            // Si es la última pregunta, cambiar texto del botón
            if (currentIndex === db.length - 1) {
                document.getElementById('btn-next-study').innerText = "Terminar Repaso 🏁";
            } else {
                document.getElementById('btn-next-study').innerText = "Siguiente Pregunta ➡️";
            }
        }

        function nextStudyQuestion() {
            currentIndex++;
            if (currentIndex < db.length) {
                loadStudyQuestion();
            } else {
                alert("¡Has terminado de repasar todas las tarjetas!");
                goHome();
            }
        }

        // --- LÓGICA MODO EXAMEN ---
        function loadExamQuestion() {
            const data = db[currentIndex];
            document.getElementById('exam-progress').innerText = `Pregunta ${currentIndex + 1} de ${db.length}`;
            document.getElementById('exam-question').innerText = data.question;
            document.getElementById('btn-next-exam').classList.add('hidden');

            const optionsContainer = document.getElementById('exam-options');
            optionsContainer.innerHTML = ''; // Limpiar opciones anteriores

            // Mezclar opciones para que no estén siempre en el mismo orden
            const shuffledOptions = [...data.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option, data.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, selectedAnswer, correctAnswer) {
            const buttons = document.querySelectorAll('.option-btn');
            
            // Deshabilitar todos los botones para que no haga doble click
            buttons.forEach(btn => btn.classList.add('disabled'));

            if (selectedAnswer === correctAnswer) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                // Resaltar la correcta automáticamente
                buttons.forEach(btn => {
                    if (btn.innerText === correctAnswer) {
                        btn.classList.add('correct');
                    }
                });
            }

            document.getElementById('btn-next-exam').classList.remove('hidden');
            
            if (currentIndex === db.length - 1) {
                document.getElementById('btn-next-exam').innerText = "Ver Resultados 🏁";
            } else {
                document.getElementById('btn-next-exam').innerText = "Siguiente Pregunta ➡️";
            }
        }

        function nextExamQuestion() {
            currentIndex++;
            if (currentIndex < db.length) {
                loadExamQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            hideAllScreens();
            resultsScreen.classList.remove('hidden');
            document.getElementById('score-display').innerText = `${score} / ${db.length}`;
            
            const message = document.getElementById('score-message');
            const percentage = score / db.length;
            
            if (percentage === 1) message.innerText = "¡Perfección absoluta! 🏆";
            else if (percentage >= 0.7) message.innerText = "¡Muy bien hecho! 🌟";
            else if (percentage >= 0.5) message.innerText = "Has aprobado, pero toca repasar un poco. 👍";
            else message.innerText = "Necesitas seguir practicando. ¡Tú puedes! 💪";
        }
    </script>
</body>
</html>
